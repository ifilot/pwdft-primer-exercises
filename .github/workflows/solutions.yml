name: solutions

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the quick solutions (long ones are run locally)
        run: bash run_solutions.sh --quick
